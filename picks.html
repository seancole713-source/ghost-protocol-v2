<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ghost</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#F6F4F1; --surface:#FFFFFF; --surface-2:#EDE9E4; --sunken:#E4DFD8;
  --ink:#1A1922; --ink-2:#56535F; --ink-3:#8B8794;
  --line:#E1DCD5; --line-2:#CFC8BF;
  --accent:#3E3A8F; --accent-soft:#E6E4F5;
  --good:#0E7565; --good-soft:#DDEFEB;
  --bad:#A33D2D; --bad-soft:#F6E3DE;
  --warn:#8F6410; --warn-soft:#F5EAD3;
  --shadow:0 1px 2px rgba(26,25,34,.05),0 8px 24px -12px rgba(26,25,34,.18);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#131319; --surface:#1C1C23; --surface-2:#24242D; --sunken:#101015;
    --ink:#F3F1ED; --ink-2:#A9A6B3; --ink-3:#6F6C7B;
    --line:#2C2C37; --line-2:#3A3A47;
    --accent:#9C98F2; --accent-soft:#25243A;
    --good:#4ECBB3; --good-soft:#12302C;
    --bad:#E88C77; --bad-soft:#33201B;
    --warn:#DFAF55; --warn-soft:#302713;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --ground:#131319; --surface:#1C1C23; --surface-2:#24242D; --sunken:#101015;
  --ink:#F3F1ED; --ink-2:#A9A6B3; --ink-3:#6F6C7B;
  --line:#2C2C37; --line-2:#3A3A47;
  --accent:#9C98F2; --accent-soft:#25243A;
  --good:#4ECBB3; --good-soft:#12302C;
  --bad:#E88C77; --bad-soft:#33201B;
  --warn:#DFAF55; --warn-soft:#302713;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--ground);color:var(--ink);
  font-family:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,sans-serif;
  font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;
  min-height:100vh;
}
a{color:inherit}
.wrap{max-width:640px;margin:0 auto;padding:0 0 100px}

/* header */
.topbar{position:sticky;top:0;z-index:30;background:var(--ground);border-bottom:1px solid var(--line);
  padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:8px}
.brand b{font-family:"Newsreader",Georgia,serif;font-size:19px;font-weight:600;letter-spacing:-.01em}
.livedot{display:inline-flex;align-items:center;gap:6px;font-family:"IBM Plex Mono",monospace;font-size:10px;
  letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);border:1px solid var(--line);border-radius:999px;padding:5px 9px}
.livedot i{width:6px;height:6px;border-radius:50%;background:var(--good);display:block}
.livedot.off i{background:var(--ink-3)}
.stamp{font-size:11.5px;color:var(--ink-3)}

/* tabs */
.tabs{position:sticky;top:53px;z-index:29;background:var(--ground);border-bottom:1px solid var(--line);
  display:flex;padding:0 18px;gap:4px;overflow-x:auto}
.tabbtn{font-family:"IBM Plex Sans",sans-serif;font-size:14px;font-weight:500;padding:12px 4px;margin-right:20px;
  border:none;background:transparent;color:var(--ink-3);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tabbtn[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.tabbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.view{padding:20px 18px 0;display:flex;flex-direction:column;gap:18px}
[hidden]{display:none !important}

/* verdict card */
.verdict{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);
  padding:20px;display:flex;flex-direction:column;gap:12px}
.verdict .q{font-size:13px;color:var(--ink-3)}
.verdict .a{font-family:"Newsreader",Georgia,serif;font-size:clamp(36px,10vw,48px);line-height:.98;font-weight:500;
  letter-spacing:-.02em;margin:0}
.verdict .a.no{color:var(--ink)}
.verdict .a.yes{color:var(--good)}
.verdict .because{font-size:14.5px;color:var(--ink-2);line-height:1.5}
.verdict .because b{color:var(--ink);font-weight:600}

.facts{display:flex;flex-direction:column;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.fact{background:var(--surface);padding:13px 16px;display:flex;flex-direction:column;gap:3px}
.fact .line{display:flex;align-items:baseline;gap:10px}
.fact .lbl{font-size:14px;color:var(--ink);flex:1}
.fact .val{font-family:"IBM Plex Mono",monospace;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.fact .val.ok{color:var(--good)} .fact .val.no{color:var(--bad)} .fact .val.mid{color:var(--warn)}
.fact .mean{font-size:12.5px;color:var(--ink-3);line-height:1.45}

/* alert (same-day squeeze, no confidence claim) */
.alert{background:var(--warn-soft);border:1px solid var(--line);border-radius:14px;padding:15px 16px;display:flex;flex-direction:column;gap:6px}
.alert .k{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--warn);font-weight:600}
.alert .t{font-size:15px;font-weight:600}
.alert .d{font-size:13.5px;color:var(--ink-2)}

/* pick card */
.pick{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:18px;display:flex;flex-direction:column;gap:16px}
.pick-top{display:flex;align-items:flex-start;gap:12px}
.pick-sym{display:flex;flex-direction:column;gap:2px;flex:1}
.pick-sym b{font-size:24px;font-weight:600;letter-spacing:-.02em;line-height:1}
.pick-sym span{font-size:12.5px;color:var(--ink-3)}
.conf{display:flex;flex-direction:column;align-items:flex-end;gap:2px;text-align:right}
.conf .num{font-family:"IBM Plex Mono",monospace;font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1;color:var(--good);letter-spacing:-.02em}
.conf .num.pending{color:var(--ink-3);font-size:18px}
.conf .band{font-size:11px;color:var(--ink-3);max-width:120px;line-height:1.35}

.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.lvl{background:var(--surface);padding:10px 11px;display:flex;flex-direction:column;gap:3px}
.lvl .k{font-size:10.5px;color:var(--ink-3);line-height:1.3}
.lvl .v{font-family:"IBM Plex Mono",monospace;font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}
.lvl.target .v{color:var(--good)} .lvl.stop .v{color:var(--bad)}

.why{display:flex;flex-direction:column;gap:8px}
.why h4{margin:0;font-size:12.5px;color:var(--ink-3);font-weight:500}
.why ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px}
.why li{font-size:13.5px;color:var(--ink-2);line-height:1.45;padding-left:15px;position:relative}
.why li::before{content:"";position:absolute;left:0;top:7px;width:5px;height:5px;border-radius:50%;background:var(--good)}
.why li.fail::before{background:var(--bad)}
.why li b{color:var(--ink);font-weight:600}
.why .src{color:var(--ink-3);font-size:12px}

.veto{background:var(--bad-soft);border-radius:10px;padding:11px 13px;font-size:13px;color:var(--bad);font-weight:500}

/* score tiles */
.score{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px 14px;display:flex;flex-direction:column;gap:4px}
.tile .k{font-size:12.5px;color:var(--ink)}
.tile .v{font-family:"IBM Plex Mono",monospace;font-size:23px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.tile .s{font-size:11.5px;color:var(--ink-3);line-height:1.4}
.tile.win .v{color:var(--good)} .tile.loss .v{color:var(--bad)}

.ledger{display:flex;flex-direction:column;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{background:var(--surface);padding:13px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row .sym{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:13.5px;width:52px;flex-shrink:0}
.row .what{flex:1;min-width:170px;font-size:13px;color:var(--ink-2)}
.row .what b{color:var(--ink);font-weight:600}
.pill{font-size:10.5px;padding:3px 7px;border-radius:5px;font-weight:600;flex-shrink:0}
.pill.ok{background:var(--good-soft);color:var(--good)}
.pill.no{background:var(--bad-soft);color:var(--bad)}
.pill.wait{background:var(--surface-2);color:var(--ink-3)}

/* card wrapper section */
.section{display:flex;flex-direction:column;gap:12px}
.section h2{margin:0;font-family:"Newsreader",Georgia,serif;font-size:18px;font-weight:500}
.hint{font-size:13px;color:var(--ink-3);line-height:1.5}

.empty{background:var(--surface);border:1px dashed var(--line-2);border-radius:14px;padding:22px 18px;text-align:center;color:var(--ink-3);font-size:13.5px}

/* system tab */
.sysrow{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px 15px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.sysrow .k{font-size:14px}
.sysrow .v{font-family:"IBM Plex Mono",monospace;font-size:13px;font-weight:600}
.sysrow .v.ok{color:var(--good)} .sysrow .v.no{color:var(--bad)}

.loading{padding:40px 0;text-align:center;color:var(--ink-3);font-size:13.5px}
.err{background:var(--bad-soft);color:var(--bad);border-radius:10px;padding:12px 14px;font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <header class="topbar">
    <div class="brand"><b>Ghost</b></div>
    <div style="display:flex;align-items:center;gap:8px">
      <span class="livedot" id="livedot"><i></i><span id="livedot-txt">Loading</span></span>
    </div>
  </header>
  <div class="stamp" style="padding:6px 18px 0" id="stamp"></div>

  <nav class="tabs" role="tablist" aria-label="Ghost sections">
    <button class="tabbtn" id="tab-today" role="tab" aria-selected="true" aria-controls="view-today">Today</button>
    <button class="tabbtn" id="tab-mystocks" role="tab" aria-selected="false" aria-controls="view-mystocks">My stocks</button>
    <button class="tabbtn" id="tab-record" role="tab" aria-selected="false" aria-controls="view-record">Record</button>
    <button class="tabbtn" id="tab-system" role="tab" aria-selected="false" aria-controls="view-system">System</button>
  </nav>

  <main>
    <section class="view" id="view-today" role="tabpanel" aria-labelledby="tab-today"><div class="loading">Loading today's read…</div></section>
    <section class="view" id="view-mystocks" role="tabpanel" aria-labelledby="tab-mystocks" hidden><div class="loading">Loading your stocks…</div></section>
    <section class="view" id="view-record" role="tabpanel" aria-labelledby="tab-record" hidden><div class="loading">Loading the record…</div></section>
    <section class="view" id="view-system" role="tabpanel" aria-labelledby="tab-system" hidden><div class="loading">Loading system status…</div></section>
  </main>
</div>

<script>
(function(){
'use strict';

function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
}); }
function fmt(n, d){ if(n==null||isNaN(n)) return '—'; return Number(n).toFixed(d==null?2:d); }
function fmtPct(n, d){ if(n==null||isNaN(n)) return '—'; return Number(n).toFixed(d==null?1:d)+'%'; }
function money(n){ if(n==null||isNaN(n)) return '—'; return '$'+Number(n).toFixed(2); }

async function getJson(url){
  try{
    var r = await fetch(url, {headers:{'Accept':'application/json'}});
    if(!r.ok) return {ok:false, status:r.status};
    var j = await r.json();
    j.__ok = j.ok !== false;
    return j;
  }catch(e){ return {ok:false, __ok:false, error:String(e)}; }
}

/* ---------------------------------------------------------------- tabs -- */
var tabs = [
  {btn:document.getElementById('tab-today'), panel:document.getElementById('view-today'), load:loadToday, loaded:false},
  {btn:document.getElementById('tab-mystocks'), panel:document.getElementById('view-mystocks'), load:loadMyStocks, loaded:false},
  {btn:document.getElementById('tab-record'), panel:document.getElementById('view-record'), load:loadRecord, loaded:false},
  {btn:document.getElementById('tab-system'), panel:document.getElementById('view-system'), load:loadSystem, loaded:false},
];
function selectTab(i){
  tabs.forEach(function(t, j){
    var on = i===j;
    t.btn.setAttribute('aria-selected', on ? 'true':'false');
    t.panel.hidden = !on;
    if(on && !t.loaded){ t.loaded = true; t.load(); }
  });
}
tabs.forEach(function(t,i){ t.btn.addEventListener('click', function(){ selectTab(i); }); });

/* ------------------------------------------------------------- header --- */
async function loadHeader(){
  var v = await getJson('/api/_version');
  var dot = document.getElementById('livedot'), txt = document.getElementById('livedot-txt');
  if(v.__ok){ dot.classList.remove('off'); txt.textContent = 'Live'; }
  else { dot.classList.add('off'); txt.textContent = 'Offline'; }
  document.getElementById('stamp').textContent = new Date().toLocaleString('en-US', {
    weekday:'long', month:'long', day:'numeric', hour:'numeric', minute:'2-digit'
  });
}

/* --------------------------------------------------------- checklist UI - */
function conditionBadge(box){
  var cls = box.state === 'pass' ? 'ok' : (box.state === 'fail' ? 'no' : 'wait');
  var word = box.state === 'pass' ? 'Yes' : (box.state === 'fail' ? 'No' : "Don't know");
  return '<span class="pill '+cls+'">'+word+'</span>';
}

function pickCard(sym, direction, entry, target, stop, report){
  var confBlock;
  var conf = report && report.confidence;
  if(conf && conf.confidence_pct != null){
    confBlock = '<div class="conf"><span class="num">'+fmtPct(conf.confidence_pct,0)+'</span>'
      + '<span class="band">'+esc(conf.explanation||'')+'</span></div>';
  } else {
    confBlock = '<div class="conf"><span class="num pending">Not proven yet</span>'
      + '<span class="band">'+esc((conf&&conf.explanation)||'Ghost needs more finished calls like this one before it will put a number on it.')+'</span></div>';
  }

  var levels = '';
  if(entry!=null || target!=null || stop!=null){
    levels = '<div class="levels">'
      + '<div class="lvl"><span class="k">Buy at</span><span class="v">'+money(entry)+'</span></div>'
      + '<div class="lvl target"><span class="k">Aiming for</span><span class="v">'+money(target)+'</span></div>'
      + '<div class="lvl stop"><span class="k">Get out if it hits</span><span class="v">'+money(stop)+'</span></div>'
      + '</div>';
  }

  var whyItems = '';
  if(report && report.groups){
    report.groups.forEach(function(g){
      g.boxes.forEach(function(b){
        if(b.state === 'unknown') return;
        whyItems += '<li class="'+(b.state==='pass'?'':'fail')+'"><b>'+esc(b.label)+'</b>'
          + (b.source ? ' <span class="src">— '+esc(b.source)+'</span>' : '') + '</li>';
      });
    });
  }
  var whyBlock = whyItems ? '<div class="why"><h4>What Ghost is seeing</h4><ul>'+whyItems+'</ul></div>' : '';

  var vetoBlock = '';
  if(report && report.blocked){
    vetoBlock = '<div class="veto">Blocked: '+esc(report.block_reason||'a risk check failed')+'</div>';
  }

  var coverage = report ? '<div class="hint">Verified '+fmtPct(report.evidence_coverage_pct,0)+' of what Ghost checks for'
    + (report.direction_strength_pct!=null ? ' — of that, '+fmtPct(report.direction_strength_pct,0)+' points '+(direction==='UP'?'up':'down') : '')
    + '.</div>' : '';

  return '<div class="pick">'
    + '<div class="pick-top"><div class="pick-sym"><b>'+esc(sym)+'</b><span>'+(direction==='UP'?'Betting it goes up':'Betting it goes down')+'</span></div>'
    + confBlock + '</div>'
    + levels + coverage + vetoBlock + whyBlock
    + '</div>';
}

/* -------------------------------------------------------------- Today --- */
async function loadToday(){
  var el = document.getElementById('view-today');
  var results = await Promise.all([
    getJson('/api/squeeze/picks'),
    getJson('/api/picks?limit=5'),
    getJson('/api/wolf/kill-status'),
  ]);
  var squeeze = results[0], picksResp = results[1], kill = results[2];

  var html = '';

  var squeezeAlerts = (squeeze.__ok && Array.isArray(squeeze.picks)) ? squeeze.picks : [];
  var activePicks = (picksResp.__ok && Array.isArray(picksResp.active)) ? picksResp.active : [];

  var paused = kill.__ok ? !!(kill.engine_pause && kill.engine_pause.paused) : null;

  // Enrich active picks only with their immutable issue-time checklist.
  var enriched = [];
  var top = activePicks.slice(0, 3);
  if(top.length){
    var checklists = await Promise.all(top.map(function(p){
      if(p.id == null) return Promise.resolve({__ok:false});
      return getJson('/api/ghost/checklist/prediction/'+encodeURIComponent(p.id));
    }));
    top.forEach(function(p, i){ enriched.push({pick:p, report: checklists[i].__ok ? checklists[i] : null}); });
  }

  var anyProvenPick = enriched.some(function(e){ return e.report && e.report.confidence && e.report.confidence.confidence_pct != null; });
  var anySqueeze = squeezeAlerts.length > 0;
  var found = anyProvenPick || anySqueeze;

  html += '<div class="verdict"><div class="q">Did Ghost find a squeeze today?</div>';
  if(found){
    html += '<p class="a yes">'+(found?'Yes.':'No.')+'</p>';
    html += '<p class="because">'
      + (anySqueeze ? '<b>'+squeezeAlerts.length+'</b> unusual-volume alert'+(squeezeAlerts.length===1?'':'s')+' right now. ' : '')
      + (anyProvenPick ? 'At least one pick has a proven confidence number behind it.' : '')
      + '</p>';
  } else {
    html += '<p class="a no">No.</p>';
    html += '<p class="because">Ghost scanned '+(activePicks.length)+' setup'+(activePicks.length===1?'':'s')+' and none cleared the bar'
      + (paused ? ', and its own kill switch has it paused right now.' : '.') + '</p>';
  }
  if(paused){
    html += '<div class="facts"><div class="fact"><div class="line"><span class="lbl">How it\'s been doing lately</span><span class="val no">Paused</span></div>'
      + '<div class="mean">Ghost has been wrong too often recently, so it shut itself off. It won\'t hand you a new pick until that recovers.</div></div></div>';
  }
  html += '</div>';

  if(squeezeAlerts.length){
    html += '<div class="section"><h2>Unusual activity right now</h2>'
      + '<div class="hint">Same-day moves. These are alerts, not predictions — Ghost does not have a proven confidence number for same-day moves, so none is shown.</div>';
    squeezeAlerts.slice(0,5).forEach(function(p){
      var alertSymbol = esc(p.symbol||'');
      html += '<div class="alert"><div class="k">Worth a look</div>'
        + '<div class="t">unusual volume on '+alertSymbol+', worth a look.</div></div>';
    });
    html += '</div>';
  }

  if(enriched.length){
    html += '<div class="section"><h2>Today\'s picks</h2>';
    enriched.forEach(function(e){
      html += pickCard(e.pick.symbol, (e.pick.direction||'UP').toUpperCase(), e.pick.entry_price, e.pick.target_price, e.pick.stop_price, e.report);
    });
    html += '</div>';
  }

  if(!squeezeAlerts.length && !enriched.length){
    html += '<div class="empty">Nothing to show today. Check back after the next scan.</div>';
  }

  el.innerHTML = html;
}

/* ----------------------------------------------------------- My stocks - */
async function loadMyStocks(){
  var el = document.getElementById('view-mystocks');
  var resp = await getJson('/api/my-picks');
  if(!resp.__ok){
    el.innerHTML = '<div class="err">Couldn\'t load your stocks right now.</div>';
    return;
  }
  var picks = Array.isArray(resp.picks) ? resp.picks : [];
  if(!picks.length){
    el.innerHTML = '<div class="empty">You haven\'t added any stocks to watch yet.</div>';
    return;
  }
  var checklists = await Promise.all(picks.map(function(p){
    return getJson('/api/ghost/checklist/'+encodeURIComponent(p.symbol)+'?direction=UP');
  }));
  var html = '<div class="section"><h2>Your stocks</h2>';
  picks.forEach(function(p, i){
    var report = checklists[i].__ok ? checklists[i] : null;
    var lp = p.live_price;
    html += '<div class="pick"><div class="pick-top"><div class="pick-sym"><b>'+esc(p.symbol)+'</b>'
      + '<span>Live price '+money(lp)+'</span></div>';
    if(report && report.confidence && report.confidence.confidence_pct != null){
      html += '<div class="conf"><span class="num">'+fmtPct(report.confidence.confidence_pct,0)+'</span><span class="band">confidence</span></div>';
    } else {
      html += '<div class="conf"><span class="num pending">—</span><span class="band">Not proven yet</span></div>';
    }
    html += '</div>';
    if(report){
      html += '<div class="hint">Verified '+fmtPct(report.evidence_coverage_pct,0)+' of what Ghost checks for'
        + (report.direction_strength_pct!=null ? ', '+fmtPct(report.direction_strength_pct,0)+' of it points up' : '') + '.</div>';
    }
    html += '</div>';
  });
  html += '</div>';
  el.innerHTML = html;
}

/* -------------------------------------------------------------- Record - */
async function loadRecord(){
  var el = document.getElementById('view-record');
  var results = await Promise.all([
    getJson('/api/ghost/checklist/record?limit=25'),
    getJson('/api/wallet'),
  ]);
  var rec = results[0], wallet = results[1];
  var snaps = (rec.__ok && Array.isArray(rec.snapshots)) ? rec.snapshots : [];

  var made = snaps.filter(function(s){ return s.outcome === 'WIN'; }).length;
  var missed = snaps.filter(function(s){ return s.outcome === 'LOSS'; }).length;
  var expired = snaps.filter(function(s){ return s.outcome === 'EXPIRED'; }).length;

  var html = '<div class="score">'
    + '<div class="tile win"><span class="k">Made it</span><span class="v">'+made+'</span><span class="s">Reached the price Ghost aimed for</span></div>'
    + '<div class="tile loss"><span class="k">Stopped out</span><span class="v">'+missed+'</span><span class="s">Reached the get-out price first</span></div>'
    + '<div class="tile"><span class="k">Expired</span><span class="v">'+expired+'</span><span class="s">Reached neither price in the watch window</span></div>';
  if(wallet.__ok && wallet.total_value != null){
    html += '<div class="tile"><span class="k">Practice balance</span><span class="v">'+money(wallet.total_value)+'</span><span class="s">Started at '+money(wallet.starting_balance||10000)+'</span></div>';
  }
  html += '</div>';

  if(!snaps.length){
    html += '<div class="empty">No finished calls yet. Ghost holds each pick for its full watch window before scoring it.</div>';
  } else {
    html += '<div class="ledger">';
    snaps.forEach(function(s){
      var right = s.outcome === 'WIN';
      var expiredCall = s.outcome === 'EXPIRED';
      var detail = right
        ? 'reached the target at '+money(s.resolved_price)
        : (expiredCall
          ? 'reached neither target nor get-out price before the watch window ended at '+money(s.resolved_price)
          : 'hit the get-out price at '+money(s.resolved_price));
      var verdict = right ? 'Right.' : (expiredCall ? 'Expired.' : 'Wrong.');
      var pill = right ? 'Made it' : (expiredCall ? 'Expired' : 'Stopped out');
      html += '<div class="row"><span class="sym">'+esc(s.symbol)+'</span>'
        + '<span class="what"><b>'+verdict+'</b> Aimed for '+money(s.target_price)+', '+detail+'.</span>'
        + '<span class="pill '+(right?'ok':'no')+'">'+pill+'</span></div>';
    });
    html += '</div>';
  }
  el.innerHTML = html;
}

/* -------------------------------------------------------------- System - */
async function loadSystem(){
  var el = document.getElementById('view-system');
  var results = await Promise.all([
    getJson('/api/health'),
    getJson('/api/wolf/kill-status'),
    getJson('/api/system/degraded'),
  ]);
  var health = results[0], kill = results[1], degraded = results[2];

  var html = '<div class="section"><h2>Is Ghost healthy?</h2>';
  html += '<div class="sysrow"><span class="k">Overall</span><span class="v '+(health.__ok?'ok':'no')+'">'+(health.__ok?'OK':'Trouble')+'</span></div>';
  if(kill.__ok){
    var paused = !!(kill.engine_pause && kill.engine_pause.paused);
    html += '<div class="sysrow"><span class="k">Making new picks</span><span class="v '+(paused?'no':'ok')+'">'+(paused?'Paused':'Yes')+'</span></div>';
    if(paused && kill.engine_pause.reason){
      html += '<div class="hint">Why: '+esc(kill.engine_pause.reason)+'</div>';
    }
  }
  if(degraded.__ok){
    var isDeg = !!degraded.degraded;
    html += '<div class="sysrow"><span class="k">Running normally</span><span class="v '+(isDeg?'no':'ok')+'">'+(isDeg?'Degraded':'Yes')+'</span></div>';
  }
  html += '</div>';
  el.innerHTML = html;
}

loadHeader();
selectTab(0);
setInterval(loadHeader, 60000);
})();
</script>
