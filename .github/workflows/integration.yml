name: Integration Tests

on:
  workflow_dispatch:
  push:
    tags:
      - "rc-*"

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ghost_ci
          POSTGRES_PASSWORD: ephemeral_ci_only
          POSTGRES_DB: ghost_ci_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ghost_ci -d ghost_ci_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      GHOST_INTEGRATION_TESTS: "1"
      TEST_DATABASE_URL: postgresql://ghost_ci:ephemeral_ci_only@127.0.0.1:5432/ghost_ci_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Run DB integration tests
        run: make test-integration
