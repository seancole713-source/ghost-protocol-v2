name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Target app base URL for live gates"
        required: false
        default: "https://ghost-protocol-v2-production.up.railway.app"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Verify native prediction runtime
        run: python scripts/runtime_preflight.py

      - name: Run fast test suite
        run: make test

      - name: Run compile checks
        run: make test-compile

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ghost_ci
          POSTGRES_PASSWORD: ephemeral_ci_only
          POSTGRES_DB: ghost_ci_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ghost_ci -d ghost_ci_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      GHOST_INTEGRATION_TESTS: "1"
      TEST_DATABASE_URL: postgresql://ghost_ci:ephemeral_ci_only@127.0.0.1:5432/ghost_ci_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Run DB integration tests
        run: make test-integration

  playwright-smoke:
    if: github.event_name != 'pull_request'
    # Playwright 1.59.1 does not support the Ubuntu 26.04 ubuntu-latest image.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      BASE_URL: ${{ github.event.inputs.base_url || 'https://ghost-protocol-v2-production.up.railway.app' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Every push to main triggers Railway asynchronously. A generic health
      # check can pass against the old container before the target deploy even
      # starts, so require the exact commit three times in a row. This also lets
      # the edge finish routing away from the draining instance before browsers
      # begin. Manual runs target an operator-selected URL and use health only.
      - name: Wait for deploy to settle
        env:
          EXPECTED_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          echo "Waiting for the target deployment to be stable..."
          ok=0
          deadline=$((SECONDS + 900))
          i=0
          while [ "$SECONDS" -lt "$deadline" ]; do
            i=$((i + 1))
            if [ "$EVENT_NAME" = "push" ]; then
              deployed_sha=$(
                curl -fsS --max-time 10 "$BASE_URL/api/_version" 2>/dev/null |
                  python3 -c 'import json,sys; print(json.load(sys.stdin).get("git_sha", ""))' 2>/dev/null || true
              )
              ready=false
              if [ "$deployed_sha" = "$EXPECTED_SHA" ]; then
                ready=true
              fi
              detail="sha=${deployed_sha:-unavailable} expected=$EXPECTED_SHA"
            else
              code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$BASE_URL/health" || echo 000)
              ready=false
              if [ "$code" = "200" ]; then
                ready=true
              fi
              detail="health_http=$code"
            fi
            if [ "$ready" = "true" ]; then
              ok=$((ok+1))
              if [ "$ok" -ge 3 ]; then
                echo "Target deployment stable x3 — proceeding"
                exit 0
              fi
            else
              echo "attempt $i: $detail — resetting streak"
              ok=0
            fi
            sleep 5
          done
          echo "::error::Target deployment did not stabilize within 15 min"
          exit 1

      - name: Run Playwright smoke suite
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore

      - name: Upload Playwright test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          if-no-files-found: ignore

  release-gates:
    # U44: the gates are read-only checks of the LIVE deployment. They used to
    # be skipped whenever an upstream job (often a flaky browser smoke) failed,
    # so a red post-merge lane also meant an unchecked deploy. They now run
    # unless the run was cancelled; the upstream failure still fails the run.
    if: ${{ !cancelled() && github.event_name != 'pull_request' }}
    needs: [test, integration, playwright-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE_URL: ${{ github.event.inputs.base_url || 'https://ghost-protocol-v2-production.up.railway.app' }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      ERROR_SIGNATURE_BASELINE: .github/error-signatures-baseline.json
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      # Without CRON_SECRET the health-audit and error-signature gates cannot
      # check anything: each emits a "NOT VERIFIED" warning annotation and job
      # summary entry and prints "SKIPPED: <reason>", never PASS. On a push to
      # main an unchecked gate FAILS its step (exit 1); manual dispatches stay
      # warning-only. With the secret, they call
      # POST /api/health/audit?auto_fix=false&persist=false, which is
      # read-only (no self-heal writes, no history row).
      - name: Check CRON_SECRET secret
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::warning::CRON_SECRET repository secret not configured — health-audit and error-signature gates are NOT VERIFIED (fails the job on push to main)"
            {
              echo "### Release gates: NOT VERIFIED"
              echo
              echo "CRON_SECRET is not available to this run, so the zero-critical health-audit gate and the production error-signature gate cannot check the deployment."
              echo
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Run deploy go/no-go
        run: bash scripts/go-no-go.sh

      - name: Verify prediction evidence APIs
        env:
          EXPECTED_SHA: ${{ github.event_name == 'push' && github.sha || '' }}
        run: python3 scripts/verify_prediction_pipeline.py

      - name: Require zero critical health-audit findings
        run: python3 scripts/verify_health_audit.py

      - name: Alert on new ERROR signatures
        run: python3 scripts/check_error_signatures.py

  browser-offline-candidate:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    # Playwright 1.59.1 does not support the Ubuntu 26.04 ubuntu-latest image.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Evidence for the exact reviewed candidate, not this workflow commit.
          ref: 6014ebd7e36f42143fd5b09215466870f2c53fca
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Prove desktop and mobile layout with every request blocked
        run: >-
          npx playwright test e2e/cockpit.layout.spec.ts
          --project=desktop-chromium --project=mobile-chromium
          --workers=1 --reporter=line
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-candidate-browser-results
          path: test-results/
          if-no-files-found: ignore


  browser-readonly-safety:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    # Playwright 1.59.1 does not support the Ubuntu 26.04 ubuntu-latest image.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify actual-candidate portfolio network guard without an app
        run: >-
          npx playwright test e2e/portfolio-readonly.spec.ts
          --project=desktop-chromium --project=mobile-chromium
          --workers=1 --reporter=line
