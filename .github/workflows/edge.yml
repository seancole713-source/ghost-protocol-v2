name: edge
on:
  pull_request:
    paths: ["edge/**", "shared/**", "tests/test_edge_*.py", ".github/workflows/edge.yml"]
  push:
    branches: [main]
    paths: ["edge/**", "shared/**"]
jobs:
  edge-alone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        # U23: same interpreter as production (.python-version, 3.12.x), not 3.11.
        with: {python-version-file: ".python-version"}
      - name: Install edge's own dependencies only
        run: pip install -r edge/requirements.txt pytest==9.1.1
      - name: edge imports nothing from Ghost
        run: |
          if grep -rnE "^(from|import) (core|wolf_app|mcp)\b" edge/; then
            echo "edge must not import Ghost code"; exit 1; fi
      - name: edge tests, without Ghost's conftest
        run: python -m pytest -q -p no:cacheprovider --noconftest tests/test_edge_*.py -k "not mcp_tool"
